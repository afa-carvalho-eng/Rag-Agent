[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "A document question-answering agent: RAG with a Claude tool-use loop, deployable on AWS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
aws = [
    "anthropic[bedrock]>=2.0",
    "awslambdaric>=2.0",
    "boto3>=1.34",
    "opensearch-py>=2.4",
    "requests>=2.31",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ragagent = "ragagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI declares dependencies with Depends() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ragagent", "evals", "tests"]
