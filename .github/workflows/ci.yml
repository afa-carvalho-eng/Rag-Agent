name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,aws]" -r infra/requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Retrieval eval
        run: python evals/retrieval_eval.py --min-hit-at-1 0.7
      - name: Synthesize the infrastructure
        working-directory: infra
        env:
          CDK_OUTDIR: ${{ runner.temp }}/cdk.out
        run: python app.py
